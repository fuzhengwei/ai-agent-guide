# ========== LLM 代理 - API Key 轮询负载均衡 ==========
# 使用 split_clients 按比例分配 Key，实现真正的负载均衡
# split_clients 对 "request_id + remote_addr" 取哈希后按百分比分流

split_clients "${request_id}${remote_addr}" $llm_api_key {
    33%  "sk-46Sab5SEzuLZypINZf65k9WEqCMvVeqvRS6sl7rYEX5Cz8zd";
    33%  "sk-h0swRgro9Uak9gCURyQMTKo6LtEaG5EgSA8vhUFg3J8FN8M8";
    *    "sk-pkVGhoinbanNCnkaWZGO9o4MQGUPV5v3zidQjf8dkBk8Snyd";
}

# 上游 LLM 服务
upstream llm_backend {
    server apihub.agnes-ai.cn:443;
    keepalive 32;
}

# HTTP → HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name ai-agent-guide.xiaofuge.cn;
    rewrite ^(.*) https://$server_name$1 permanent;
}
 
# HTTPS 主服务
server {
    listen       443 ssl;
    server_name  ai-agent-guide.xiaofuge.cn;
 
    ssl_certificate      /etc/nginx/ssl/_.xiaofuge.cn.pem;
    ssl_certificate_key  /etc/nginx/ssl/_.xiaofuge.cn.key;
 
    ssl_session_cache    shared:SSL:1m;
    ssl_session_timeout  5m;
 
    ssl_ciphers  HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;
 
    root /usr/share/nginx/html/ai-agent-guide.xiaofuge.cn;
    index index.html;
 
    # 字符编码
    charset utf-8;

    # ========== LLM API 代理 ==========
    # 代理路径：/api/chat/v1/chat/completions → https://apihub.agnes-ai.cn/v1/chat/completions
    # 前端请求 /api/chat/v1/chat/completions，Nginx 自动附加 API Key 并转发

    location /api/chat/v1/ {
        proxy_pass https://llm_backend/v1/;
        proxy_http_version 1.1;

        # 设置代理请求头
        proxy_set_header Host apihub.agnes-ai.cn;
        proxy_set_header Authorization "Bearer $llm_api_key";
        proxy_set_header Content-Type "application/json";

        # SSL 验证
        proxy_ssl_server_name on;
        proxy_ssl_name apihub.agnes-ai.cn;

        # SSE 流式响应支持
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_read_timeout 300s;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;

        # CORS 头（同源其实不需要，但防御性添加）
        add_header Access-Control-Allow-Origin "https://ai-agent-guide.xiaofuge.cn" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # 处理 OPTIONS 预检请求
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin "https://ai-agent-guide.xiaofuge.cn" always;
            add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            add_header Content-Length 0;
            add_header Content-Type text/plain;
            return 204;
        }
    }
 
    # ========== ToyAgent 玩具智能体（实践案例）==========
    # /toy-agent → 反向代理到 ToyAgent 服务（裸路径 301 补斜杠）
    # ^~ 优先于正则 location，避免静态资源缓存规则截胡代理请求
    location = /toy-agent {
        return 301 /toy-agent/;
    }

    location ^~ /toy-agent/ {
        proxy_pass http://180.76.188.127:8099/;
        proxy_http_version 1.1;

        # 代理请求头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 对话与执行轨迹输出较慢：关闭缓冲 + 放宽读超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ========== HTML 文件：不缓存，每次都校验 ==========
    # 确保用户始终拿到最新的 index.html 和章节页面
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ========== version.json：不缓存，用于版本检测 ==========
    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        add_header Access-Control-Allow-Origin "*";
    }

    # ========== CSS/JS 静态资源：协商缓存 ==========
    # 不使用强缓存（expires 7d），改为 must-revalidate
    # 配合 ?v= 版本号，文件不变时走 304 缓存，文件更新后立即生效
    location ~* \.(css|js)$ {
        expires 1d;
        add_header Cache-Control "public, must-revalidate";
    }

    # 其他静态资源（图片/字体等）：可强缓存，内容很少变
    location ~* \.(json|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
 
    # XML 文件（sitemap）
    location ~* \.xml$ {
        types {
            application/xml xml;
        }
        expires 1d;
        add_header Cache-Control "public, no-transform";
    }
 
    # chapters 目录
    location /chapters/ {
        try_files $uri $uri/ /index.html;
    }
 
    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
 
    # 错误页面
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
